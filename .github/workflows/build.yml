name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'manifest.yml'
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      image_name:
        description: "GHCR 镜像名称"
        required: true
        default: "argo-nezha"
        type: string
      image_tag:
        description: "镜像标签"
        required: true
        default: "latest"
        type: string

env:
  GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME || 'argo-nezha' }}
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || 'nezha' }}

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub configuration
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" != "dev" && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Docker Hub push (dev branch or missing secrets)."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image variables
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_NAME="${{ inputs.image_name }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            IMAGE_NAME="${GHCR_IMAGE_NAME}"
            IMAGE_TAG="dev"
          else
            IMAGE_NAME="${GHCR_IMAGE_NAME}"
            IMAGE_TAG="latest"
          fi

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo_owner=${REPO_OWNER}" >> "$GITHUB_OUTPUT"

          echo "Repo owner: ${REPO_OWNER}"
          echo "Image name: ${IMAGE_NAME}"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_owner }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('{0}/{1}:{2}', secrets.DOCKERHUB_USERNAME, env.DOCKERHUB_IMAGE_NAME, steps.vars.outputs.image_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "========================================"
          echo "Build completed"
          echo "========================================"
          echo "GHCR:"
          echo "ghcr.io/${{ steps.vars.outputs.repo_owner }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}"

          if [[ "${{ steps.dockerhub.outputs.enabled }}" == "true" ]]; then
            echo "Docker Hub:"
            echo "${DOCKERHUB_USERNAME}/${DOCKERHUB_IMAGE_NAME}:${{ steps.vars.outputs.image_tag }}"
          else
            echo "Docker Hub: skipped"
          fi

  cleanup:
    name: Cleanup old runs
    runs-on: ubuntu-latest
    needs: build
    if: always()

    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
