name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      image_name:
        description: "镜像名称"
        required: true
        default: "argo-nezha"
        type: string
      image_tag:
        description: "镜像标签"
        required: true
        default: "latest"
        type: string

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_NAME="${{ inputs.image_name }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            IMAGE_NAME="argo-nezha"
            IMAGE_TAG="dev"
          else
            IMAGE_NAME="argo-nezha"
            IMAGE_TAG="latest"
          fi

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Image: ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}"

  cleanup:
    name: Cleanup old runs
    runs-on: ubuntu-latest
    needs: build
    if: always()

    permissions:
      actions: write

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
